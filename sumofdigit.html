<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sum of Digits</title>

    <script>
        function calculateDigitSum() {
            const inputVal = document.getElementById("numberInput").value;

            if (inputVal === "") {
                document.getElementById("result").innerText = "Please enter a number.";
                return;
            }

            let number = Math.abs(Number(inputVal));

            if (isNaN(number)) {
                document.getElementById("result").innerText = "Please enter a valid number.";
                return;
            }

            let sum = 0;

            while (number > 0) {
                const digit = number % 10;
                sum += digit;
                number = Math.floor(number / 10);
            }

            document.getElementById("result").innerText = "Sum of digits: " + sum;
        }
    </script>
</head>
<body>

    <label for="numberInput">Enter a number:</label><br/>
    <input type="number" id="numberInput" placeholder="e.g. 1234"><br/><br/>

    <button type="button" onclick="calculateDigitSum()">Calculate Sum</button>

    <h3>Result:</h3>
    <p id="result"></p>
</body>
</html>
